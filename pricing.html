<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing · Geri's Sweets</title>
  <meta name="description" content="Custom decorated cookie pricing, add-ons and an instant estimate from Geri's Sweets.">
  <meta name="theme-color" content="#D8BA8B">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="pricing">
  <header id="site-header" class="site-header"></header>

  <main>
    <section class="page-hero" data-flowers="8">
      <div class="wrap">
        <span class="eyebrow">Simple &amp; sweet</span>
        <h1 class="ribbon">Pricing</h1>
        <p>Priced by the dozen, with a style for every celebration and budget.</p>
      </div>
      <div class="scallop scallop-bottom" aria-hidden="true"></div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="wrap">
        <div class="grid grid-2 tiers" id="tiers"></div>
        <p class="center small" id="sample-note" style="margin-top:22px"></p>
      </div>
    </section>

    <section class="section" style="padding-top:10px">
      <div class="wrap">
        <div class="card piped reveal good-to-know">
          <h3>Good to know</h3>
          <ul class="fine-print" id="fine-print"></ul>
        </div>
      </div>
    </section>

    <section class="section bg-kraft">
      <div class="wrap">
        <div class="section-head reveal">
          <span class="eyebrow">What's inside</span>
          <h2 class="ribbon">Ingredients</h2>
          <p>Every cookie is labeled with exactly what goes into it, so you can enjoy them with confidence.</p>
        </div>
        <div class="ingredient-label reveal" id="ingredients"></div>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="section-head reveal">
          <span class="eyebrow">Questions?</span>
          <h2 class="ribbon">Frequently asked</h2>
        </div>
        <div class="faq" id="faq"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cookie-art.js"></script>
  <script src="js/site.js"></script>
  <script src="js/pricing.js"></script>
</body>
</html>
